# ============================================================
# BACKGROUND
# ============================================================

background {
    monitor =
    path = /home/shad0w/Pictures/wallpapers/wo.png

    blur_passes = 0
    brightness = 1.0
    contrast = 1.0
    vibrancy = 0.0
    vibrancy_darkness = 0.0
}


# ============================================================
# GENERAL
# ============================================================

general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
    hide_cursor = true
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = rgba(180, 180, 180, 1)
    font_size = 96
    font_family = VT323
    position = -420, 90
    halign = right
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgba(180, 180, 180, 1)
    font_size = 36
    font_family = VT323
    position = -248, 10
    halign = right
    valign = center
}

# ============================================================
# AVATAR — RIGHT
# ============================================================

# USER-NAME
label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, .65)
    font_size = 26
    font_family = VT323
    position = -578, -120
    halign = right
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 220, 37
    rounding = 0
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(86, 90, 90, 1)
    inner_color = rgba(40, 40, 40, 1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = VT323
    placeholder_text = <i><span foreground="##ffffff99"></span></i>
    hide_input = false
    fail_text =
    position = -328, -120
    halign = right
    valign = center
}

# FAIL MESSAGE (separate label, sized independently)
label {
    monitor =
    text = $FAIL
    color = rgba(220, 80, 80, 0.9)
    font_size = 17
    font_family = VT323
    position = -388, -190
    halign = right
    valign = center
}
